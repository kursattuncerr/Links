<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kürşat TUNCER</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:#07070f;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Inter',sans-serif;padding:40px 20px;overflow-x:hidden}
    #bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}

    /* LOCK */
    #lockScreen{position:fixed;inset:0;z-index:1000;background:#07070f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
    #lockScreen h2{font-size:1.1rem;font-weight:700;color:#888;letter-spacing:.12em;text-transform:uppercase}
    .pin-dots{display:flex;gap:16px}
    .pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(139,92,246,.5);background:transparent;transition:background .15s,border-color .15s,box-shadow .15s}
    .pin-dot.filled{background:#8b5cf6;border-color:#8b5cf6;box-shadow:0 0 10px rgba(139,92,246,.7)}
    .pin-dot.error{background:#ef4444;border-color:#ef4444;box-shadow:0 0 10px rgba(239,68,68,.7);animation:shake .35s ease}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
    .pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:240px}
    .pin-btn{height:64px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#e8e8e8;font-size:1.4rem;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:background .15s,transform .12s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
    .pin-btn:active{background:rgba(139,92,246,.25);transform:scale(.93);box-shadow:0 0 16px rgba(139,92,246,.3)}
    .pin-btn.del{font-size:1rem;color:#666}
    .pin-btn.empty{visibility:hidden}
    #lockError{font-size:.75rem;color:#ef4444;letter-spacing:.05em;min-height:18px;opacity:0;transition:opacity .2s}
    #lockError.show{opacity:1}

    /* MAIN */
    .container{position:relative;z-index:10;width:100%;max-width:430px;display:flex;flex-direction:column;align-items:center;gap:11px;animation:fadeInUp .9s cubic-bezier(.16,1,.3,1) both}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}

    .avatar-wrap{position:relative;margin-bottom:6px;animation:avatarPop .8s cubic-bezier(.34,1.56,.64,1) .2s both}
    @keyframes avatarPop{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0deg);opacity:1}}
    .avatar-ring{position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,#8b5cf6,#ec4899,#06b6d4,#8b5cf6);animation:ringRotate 4s linear infinite;z-index:-1}
    .avatar-ring-inner{position:absolute;inset:-3px;border-radius:50%;background:#07070f;z-index:-1}
    @keyframes ringRotate{to{transform:rotate(360deg)}}
    .avatar-wrap::after{content:'';position:absolute;inset:-14px;border-radius:50%;border:1.5px solid rgba(139,92,246,.5);animation:pulseRing 2s ease-out infinite}
    .pulse2{position:absolute;inset:-28px;border-radius:50%;border:1px solid rgba(139,92,246,.3);animation:pulseRing 2s ease-out .5s infinite;pointer-events:none}
    .pulse3{position:absolute;inset:-44px;border-radius:50%;border:1px solid rgba(139,92,246,.15);animation:pulseRing 2s ease-out 1s infinite;pointer-events:none}
    @keyframes pulseRing{0%{transform:scale(.88);opacity:.9}100%{transform:scale(1.3);opacity:0}}
    .avatar{width:90px;height:90px;border-radius:50%;overflow:hidden;position:relative;z-index:1}
    .avatar img{width:100%;height:100%;object-fit:cover}

    h1{font-size:1.5rem;font-weight:900;color:#f0f0f0;letter-spacing:.03em;margin-bottom:2px;animation:fadeInUp .6s ease .4s both;text-shadow:0 0 30px rgba(139,92,246,.4)}
    .handle{font-size:.8rem;color:#444;margin-bottom:18px;letter-spacing:.06em;animation:fadeInUp .6s ease .5s both}

    .link-card{width:100%;display:flex;align-items:center;gap:14px;padding:15px 20px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);text-decoration:none;color:#e8e8e8;font-weight:600;font-size:.95rem;position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease,border-color .25s ease,background .25s ease;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;-webkit-tap-highlight-color:transparent}
    .link-card::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);transform:skewX(-20deg);transition:left .5s ease}
    .link-card:hover::before{left:150%}
    .link-card:hover{transform:translateY(-3px) scale(1.02);background:rgba(255,255,255,.055)}
    .link-card:active{transform:scale(.97)!important;transition:transform .1s ease!important}
    .link-card{opacity:0;animation:slideIn .55s cubic-bezier(.16,1,.3,1) forwards}
    .link-card:nth-child(1){animation-delay:.55s}
    .link-card:nth-child(2){animation-delay:.65s}
    .link-card:nth-child(3){animation-delay:.75s}
    .link-card:nth-child(4){animation-delay:.85s}
    .link-card:nth-child(5){animation-delay:.95s}
    @keyframes slideIn{from{opacity:0;transform:translateX(-24px) scale(.97)}to{opacity:1;transform:translateX(0) scale(1)}}

    .icon-wrap{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .icon-wrap svg{width:22px;height:22px;animation:iconWiggle 3.5s ease-in-out infinite;transform-origin:center}
    .link-card:nth-child(1) .icon-wrap svg{animation-delay:0s}
    .link-card:nth-child(2) .icon-wrap svg{animation-delay:.5s}
    .link-card:nth-child(3) .icon-wrap svg{animation-delay:1s}
    .link-card:nth-child(4) .icon-wrap svg{animation-delay:1.5s}
    .link-card:nth-child(5) .icon-wrap svg{animation-delay:2s}
    @keyframes iconWiggle{0%,100%{transform:rotate(0deg)}15%{transform:rotate(-10deg)}30%{transform:rotate(10deg)}45%{transform:rotate(-5deg)}60%{transform:rotate(5deg)}75%{transform:rotate(0deg)}}

    .label-group{display:flex;flex-direction:column}
    .label-main{font-size:.95rem;font-weight:700;color:#e8e8e8;transition:color .2s}
    .label-sub{font-size:.71rem;color:#484848;margin-top:2px;transition:color .2s}
    .link-card:hover .label-sub{color:#666}
    .arrow{margin-left:auto;color:#2a2a2a;font-size:1.1rem;transition:color .25s,transform .35s cubic-bezier(.34,1.56,.64,1)}
    .link-card:hover .arrow{color:#999;transform:translateX(6px)}

    .ig .icon-wrap{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
    .sp .icon-wrap{background:#1DB954}
    .wa .icon-wrap{background:#25D366}
    .tg .icon-wrap{background:#229ED9}
    .st .icon-wrap{background:linear-gradient(135deg,#1b2838,#2a475e);border:1px solid #4a6a8a}
    .ig:hover{border-color:rgba(220,39,67,.45);box-shadow:0 12px 40px rgba(220,39,67,.15)}
    .sp:hover{border-color:rgba(29,185,84,.45);box-shadow:0 12px 40px rgba(29,185,84,.15)}
    .wa:hover{border-color:rgba(37,211,102,.45);box-shadow:0 12px 40px rgba(37,211,102,.15)}
    .tg:hover{border-color:rgba(34,158,217,.45);box-shadow:0 12px 40px rgba(34,158,217,.15)}
    .st:hover{border-color:rgba(102,192,244,.45);box-shadow:0 12px 40px rgba(102,192,244,.15)}
    .ig:hover .label-main{color:#f472b6}
    .sp:hover .label-main{color:#4ade80}
    .wa:hover .label-main{color:#34d399}
    .tg:hover .label-main{color:#38bdf8}
    .st:hover .label-main{color:#7dd3fc}

    .spark{position:fixed;pointer-events:none;z-index:999;border-radius:50%;animation:sparkFly var(--dur) ease-out forwards}
    @keyframes sparkFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
  </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="lockScreen">
  <h2>🔒 Şifre Giriniz</h2>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
  </div>
  <div id="lockError"></div>
  <div class="pin-grid">
    <button class="pin-btn" data-n="1">1</button>
    <button class="pin-btn" data-n="2">2</button>
    <button class="pin-btn" data-n="3">3</button>
    <button class="pin-btn" data-n="4">4</button>
    <button class="pin-btn" data-n="5">5</button>
    <button class="pin-btn" data-n="6">6</button>
    <button class="pin-btn" data-n="7">7</button>
    <button class="pin-btn" data-n="8">8</button>
    <button class="pin-btn" data-n="9">9</button>
    <button class="pin-btn empty"></button>
    <button class="pin-btn" data-n="0">0</button>
    <button class="pin-btn del" id="delBtn">⌫</button>
  </div>
</div>

<script>
// LOCK
const CORRECT='3535';
let entered='';
function updateDots(){for(let i=0;i<4;i++)document.getElementById('d'+i).className='pin-dot'+(i<entered.length?' filled':'')}
function showError(){
  document.querySelectorAll('.pin-dot').forEach(d=>{d.classList.remove('filled');d.classList.add('error')});
  const e=document.getElementById('lockError');
  e.textContent='Hatalı şifre, tekrar deneyin';e.classList.add('show');
  setTimeout(()=>{document.querySelectorAll('.pin-dot').forEach(d=>d.classList.remove('error'));e.classList.remove('show');entered='';updateDots()},900)
}
function playUnlockSound(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const now=ctx.currentTime;

    // Hafif "click" sesi: kısa beyaz gürültü darbesi + bant geçiren filtre
    const bufferSize = ctx.sampleRate * 0.03; // 30ms
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      // Hızlı sönen gürültü
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.15));
    }

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1800;
    filter.Q.value = 1.2;

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    noise.start(now);
    noise.stop(now + 0.03);
  }catch(e){}
}

function unlock(){
  playUnlockSound();
  const l=document.getElementById('lockScreen'),m=document.getElementById('mainContent');
  l.style.transition='opacity .5s ease';l.style.opacity='0';
  setTimeout(()=>{
    l.style.display='none';
    m.style.display='flex';

    // Butonları ve avatarı sıfırla, güzel bir giriş animasyonu ile tekrar oynat
    const animatedEls = m.querySelectorAll('.avatar-wrap, h1, .link-card');
    animatedEls.forEach(el=>{
      el.style.animation='none';
      el.offsetHeight; // reflow ile animasyonu sıfırla
    });
    requestAnimationFrame(()=>{
      const avatar = m.querySelector('.avatar-wrap');
      const title  = m.querySelector('h1');
      const cards  = m.querySelectorAll('.link-card');
      if(avatar) avatar.style.animation = 'avatarPop 0.8s cubic-bezier(.34,1.56,.64,1) 0.05s both';
      if(title)  title.style.animation  = 'fadeInUp 0.6s ease 0.2s both';
      cards.forEach((c,i)=>{
        c.style.animation = 'slideIn 0.55s cubic-bezier(.16,1,.3,1) ' + (0.3 + i*0.1) + 's both';
      });
    });
  },500)
}
document.querySelectorAll('.pin-btn[data-n]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    if(entered.length>=4)return;
    entered+=btn.dataset.n;updateDots();
    if(entered.length===4)setTimeout(()=>entered===CORRECT?unlock():showError(),150)
  })
});
document.getElementById('delBtn').addEventListener('click',()=>{entered=entered.slice(0,-1);updateDots()});

// CANVAS — noktalar + üçgen mesh
const canvas=document.getElementById('bgCanvas');
const ctx=canvas.getContext('2d');
let W,H,dpr;
const isMobile=window.innerWidth<768;
const COUNT=isMobile?32:72;
const LINK_D=isMobile?160:190; // bağlantı mesafesi artırıldı

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr,dpr);
  dots=initDots();
}

function initDots(){
  const arr=[];
  const cols=Math.round(Math.sqrt(COUNT*W/H));
  const rows=Math.ceil(COUNT/cols);
  const cw=W/cols, ch=H/rows;
  let n=0;
  for(let r=0;r<rows&&n<COUNT;r++){
    for(let c=0;c<cols&&n<COUNT;c++){
      const x=cw*c+cw*.1+Math.random()*cw*.8;
      const y=ch*r+ch*.1+Math.random()*ch*.8;
      const a=Math.random()*Math.PI*2;
      const s=.16+Math.random()*.22;
      arr.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
        phase:Math.random()*Math.PI*2,
        hue:240+Math.random()*70,
        r:.9+Math.random()*.9});
      n++;
    }
  }
  return arr;
}

let dots=[];
resize();
window.addEventListener('resize',resize);

function tick(t){
  dots.forEach(d=>{
    d.x+=d.vx+Math.sin(t*.0007+d.phase)*.11;
    d.y+=d.vy+Math.cos(t*.00055+d.phase)*.11;
    if(d.x<0){d.x=0;d.vx=Math.abs(d.vx)}
    if(d.x>W){d.x=W;d.vx=-Math.abs(d.vx)}
    if(d.y<0){d.y=0;d.vy=Math.abs(d.vy)}
    if(d.y>H){d.y=H;d.vy=-Math.abs(d.vy)}
  })
}

function mesh(){
  const n=dots.length;
  for(let i=0;i<n-2;i++){
    for(let j=i+1;j<n;j++){
      const dij=Math.hypot(dots[i].x-dots[j].x,dots[i].y-dots[j].y);
      if(dij>LINK_D)continue;
      for(let k=j+1;k<n;k++){
        const dik=Math.hypot(dots[i].x-dots[k].x,dots[i].y-dots[k].y);
        if(dik>LINK_D)continue;
        const djk=Math.hypot(dots[j].x-dots[k].x,dots[j].y-dots[k].y);
        if(djk>LINK_D)continue;
        const area=Math.abs((dots[j].x-dots[i].x)*(dots[k].y-dots[i].y)-(dots[k].x-dots[i].x)*(dots[j].y-dots[i].y));
        if(area<800)continue;
        const fade=1-Math.max(dij,dik,djk)/LINK_D;
        // Dolu üçgen
        ctx.beginPath();
        ctx.moveTo(dots[i].x,dots[i].y);
        ctx.lineTo(dots[j].x,dots[j].y);
        ctx.lineTo(dots[k].x,dots[k].y);
        ctx.closePath();
        ctx.fillStyle='hsla('+dots[i].hue+',55%,55%,'+(fade*0.06)+')';
        ctx.fill();
        // Kenar
        ctx.strokeStyle='hsla('+dots[i].hue+',70%,70%,'+(fade*0.35)+')';
        ctx.lineWidth=0.7;
        ctx.stroke();
      }
    }
  }
}

function drawPts(){
  dots.forEach(d=>{
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
    ctx.fillStyle='hsla('+d.hue+',70%,78%,0.9)';
    ctx.fill();
  })
}

let last=0;
const FPS=isMobile?40:16;
function frame(t){
  requestAnimationFrame(frame);
  if(t-last<FPS)return;
  last=t;
  ctx.clearRect(0,0,W,H);
  tick(t);
  mesh();
  drawPts();
}
requestAnimationFrame(frame);

// Tıklama efekti
const SC=['#a78bfa','#f472b6','#38bdf8','#34d399','#fbbf24'];
function burst(x,y,n){
  for(let i=0;i<n;i++){
    const el=document.createElement('div');
    el.className='spark';
    const a=Math.random()*Math.PI*2,d=25+Math.random()*55;
    const s=2+Math.random()*3,dur=.35+Math.random()*.3;
    el.style.cssText='left:'+x+'px;top:'+y+'px;width:'+s+'px;height:'+s+'px;background:'+SC[i%SC.length]+';--tx:'+(Math.cos(a)*d)+'px;--ty:'+(Math.sin(a)*d)+'px;--dur:'+dur+'s;';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),dur*1000);
  }
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.link-card')&&!e.target.closest('.avatar-wrap')&&!e.target.closest('#lockScreen'))burst(e.clientX,e.clientY,8);
});
document.querySelectorAll('.link-card').forEach(c=>{
  c.addEventListener('click',e=>burst(e.clientX,e.clientY,5));
  if(!isMobile){
    c.addEventListener('mousemove',function(e){
      const r=this.getBoundingClientRect();
      this.style.transform='translateY(-3px) scale(1.02) rotateX('+(-(e.clientY-r.top-r.height/2)/r.height*4)+'deg) rotateY('+((e.clientX-r.left-r.width/2)/r.width*8)+'deg)';
    });
    c.addEventListener('mouseleave',function(){this.style.transform=''});
  }
});
</script>
